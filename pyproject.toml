[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "askfirst"
version = "0.1.0"
description = "Two reliable agents on one runtime: a browser form agent that asks before it submits, and a scheduled GitHub issue triage bot."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "steadfast-llm[groq]==0.3.0",
    "playwright==1.64.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
    # The same HTTP client leadgate uses (GitHub API, Discord webhooks).
    "httpx2==2.16.0",
]

[project.optional-dependencies]
# The practice site: our own forms that the browser agent is tested against.
practice = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    # FastAPI needs it to read form bodies.
    "python-multipart==0.0.33",
]
# Only for LLM_PROVIDER=anthropic (paid).
anthropic = ["steadfast-llm[anthropic]==0.3.0"]
# Only for LLM_PROVIDER=openai or LLM_FALLBACK=openai (paid).
openai = ["steadfast-llm[openai]==0.3.0"]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Non-Python files the app reads at runtime (a non-editable install, e.g. Docker, needs them).
[tool.setuptools.package-data]
"app.prompts" = ["*.txt"]
"app.browser" = ["*.js"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers as `tests.<module>`.
pythonpath = ["."]
addopts = "-ra --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: needs Playwright's Chromium installed",
    "live: calls a real network service or API; skipped unless --run-live is given",
]
filterwarnings = [
    # langsmith (pulled in by langgraph) uses an asyncio function Python 3.14 deprecates.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[tool.coverage.run]
branch = true
