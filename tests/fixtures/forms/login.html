<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Seller login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="banner" role="note">Practice forms for automation testing. Not a real job board or marketplace.</div>
  <header class="top">
    <a href="/" class="brand">Practice forms</a>
    <nav>
      <a href="/jobs/apply">Job application</a>
      <a href="/listings/new">Marketplace</a>
      <a href="/contact">Contact</a>
      <a href="/survey">Survey</a>
      <a href="/submissions">Submissions</a>
    </nav>
    <form class="search" action="/" method="get" role="search">
      <input type="search" name="q" aria-label="Search the site" placeholder="Search">
      <button type="submit">Search</button>
    </form>
  </header>
  <main>
    
<h1>Seller login</h1>

<form id="login" action="/login" method="post">
  <input type="hidden" name="next" value="/listings/new">
  <div class="field">
    <label for="login-email">Email</label>
    <input id="login-email" name="email" type="email" autocomplete="username" required="" value="">
  </div>
  <div class="field">
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required="">
  </div>
  <button type="submit">Log in</button>
</form>

  </main>

</body></html>
