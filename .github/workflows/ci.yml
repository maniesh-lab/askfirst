name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code; the token gets nothing more, whatever the repo default is.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + every test that needs no browser and no network (live tests skip themselves).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest
